# Halaman template yang disimpan tetapi disembunyikan dari navigasi.
not_in_nav: |
  /getting-started/
  /authoring/
  /examples/
  /curriculum/sample-chapter.md

# --- Plugins ----------------------------------------------------------------
plugins:
  - search

# --- Markdown extensions (shared) ------------------------------------------
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      # PHP fragments without "<?php": highlight them as inline PHP.
      extend_pygments_lang:
        - name: php-inline
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: [examples]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# --- Custom assets (shared) -------------------------------------------------
extra_css:
  - stylesheets/extra.css
extra_javascript:
  # Vendored, pinned Mermaid 11.17.2 (docs/assets/vendor/mermaid/VERSION.txt).
  # Material uses this global instead of fetching Mermaid from unpkg.
  # Keep it BEFORE the MathJax CDN script so a slow CDN cannot delay diagrams.
  - assets/vendor/mermaid/mermaid.min.js
  - javascripts/mermaid-config.js
  - javascripts/mathjax.js
  # Pinned MathJax; requires network access (CDN). See README for vendoring.
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

# --- Validation: broken links/anchors fail `mkdocs build --strict` ----------
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
